<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Olay Creator Brief</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column, sticky chip nav, views swap by hash. Cards stay quiet; the sun/moon slot badge is the one recurring loud mark. */
:root{
  --bg:#FBF4F6; --surface:#FFFFFF; --ink:#2B1620; --muted:#6B5560; --line:#EBD8E0;
  --accent:#C2185B; --accent-ink:#FFFFFF; --accent-soft:#F9DEE8;
  --am-fg:#8A5200; --am-bg:#FBEACB;
  --pm-fg:#4A2A66; --pm-bg:#E8DCF3;
  --any-fg:#7A1740; --any-bg:#F9DEE8;
  --font-display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --font-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#170E13; --surface:#22151C; --ink:#F7EAF0; --muted:#BBA3AE; --line:#3A2530;
    --accent:#FF7FAE; --accent-ink:#2B1620; --accent-soft:#3A1B29;
    --am-fg:#F5C46B; --am-bg:#3A2C10;
    --pm-fg:#CDB0E8; --pm-bg:#2E1D3B;
    --any-fg:#FFB0CC; --any-bg:#3A1B29;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#170E13; --surface:#22151C; --ink:#F7EAF0; --muted:#BBA3AE; --line:#3A2530;
  --accent:#FF7FAE; --accent-ink:#2B1620; --accent-soft:#3A1B29;
  --am-fg:#F5C46B; --am-bg:#3A2C10;
  --pm-fg:#CDB0E8; --pm-bg:#2E1D3B;
  --any-fg:#FFB0CC; --any-bg:#3A1B29;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:400 16px/1.55 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 72px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.brandline{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:14px}
.brandline b{font:400 22px/1 var(--font-display);letter-spacing:.01em}
.brandline span{font:500 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#nav{display:flex;gap:8px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:thin}
#nav a{flex:none;text-decoration:none;font:500 11.5px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:var(--surface)}
#nav a:hover{color:var(--ink);border-color:var(--accent)}
#nav a[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.view{padding-top:40px;display:block}
.view[hidden]{display:none}
.eyebrow{font:500 11.5px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{font:400 clamp(44px,9vw,92px)/.95 var(--font-display);letter-spacing:-.01em;margin:14px 0 0;text-wrap:balance}
h1 em{color:var(--accent);font-style:italic}
h2{font:400 clamp(28px,5vw,40px)/1.05 var(--font-display);margin:0;text-wrap:balance}
h3{font:600 16px/1.3 var(--font-body);margin:0}
p{margin:0}
.lede{max-width:62ch;font-size:18px;color:var(--muted);margin-top:18px}
.section{margin-top:64px}
.sechead{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.sechead p{color:var(--muted);max-width:64ch}

.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border-radius:999px;font:500 11px/1 var(--font-mono);letter-spacing:.07em;text-transform:uppercase}
.badge svg{width:14px;height:14px;flex:none}
.badge.am{background:var(--am-bg);color:var(--am-fg)}
.badge.pm{background:var(--pm-bg);color:var(--pm-fg)}
.badge.any{background:var(--any-bg);color:var(--any-fg)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:10px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-decoration:none;color:inherit;min-width:0}
a.card:hover{border-color:var(--accent)}
.card .name{font:400 26px/1.05 var(--font-display);text-wrap:balance}
.card .hook{font-size:14px;color:var(--muted)}
.card .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-top:8px;font:500 12px/1 var(--font-mono);letter-spacing:.04em}
.card .foot b{font-weight:500;font-size:15px;color:var(--ink)}
.card .foot span{color:var(--accent);text-transform:uppercase}

.routine{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px;background:var(--bg)}
.toggle button{font:500 12px/1 var(--font-mono);letter-spacing:.07em;text-transform:uppercase;border:0;background:transparent;color:var(--muted);padding:9px 16px;border-radius:999px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.steps{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:0}
.steps li{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:baseline;padding:12px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps .n{font:500 13px/1 var(--font-mono);color:var(--accent)}
.steps a{font-weight:600;text-decoration-thickness:1px;text-underline-offset:3px}
.steps small{display:block;color:var(--muted);font-size:14px}
.note{font-size:13px;color:var(--muted);margin-top:14px}

.formats{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:0;border-top:1px solid var(--line)}
.formats div{padding:18px 18px 18px 0;border-bottom:1px solid var(--line);min-width:0}
.formats p,.hooks p,.ideas p{color:var(--muted);font-size:15px;margin-top:4px}

.phead{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.phead .meta{font:500 12px/1 var(--font-mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.back{display:inline-block;margin-bottom:22px;font:500 11.5px/1 var(--font-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.back:hover{color:var(--accent)}
.pricebar{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:baseline;margin-top:26px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.pricebar b{font:400 44px/1 var(--font-display)}
.pricebar span{font:500 12px/1.4 var(--font-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.facts div{padding:16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.facts b{display:block;font:400 30px/1.05 var(--font-display);color:var(--accent);overflow-wrap:anywhere}
.facts strong{display:block;font-size:14px;margin-top:6px}
.facts span{display:block;font-size:13px;color:var(--muted);margin-top:2px}

.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{padding:8px 13px;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:14px;font-weight:500}
.tagnote{margin-top:12px;font-size:14px;color:var(--muted);max-width:64ch}

.hooks{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.hooks .card h3{font-size:17px}
.ideas{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.ideas li{padding:16px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:6px 24px}
.ideas p{margin-top:0}

.vids{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.vid{display:flex;flex-direction:column;gap:10px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.vid .plays{font:400 40px/1 var(--font-display)}
.vid .plays small{font:500 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-left:6px}
.vid .who{font:500 13px/1.3 var(--font-mono);overflow-wrap:anywhere}
.vid .meta{display:flex;flex-wrap:wrap;gap:6px 10px;font:500 11px/1.3 var(--font-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.vid .meta .tagb{color:var(--accent)}
.vid p{font-size:14px;color:var(--muted)}
.vid a.watch{margin-top:auto;padding-top:6px;font:500 12px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);text-decoration:none}
.vid a.watch:hover{text-decoration:underline}
.vnote{margin-top:14px;font-size:14px;color:var(--muted);max-width:68ch}

.say{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.say div{padding:18px;border-radius:14px;min-width:0}
.say .yes{background:var(--accent-soft)}
.say .no{border:1px dashed var(--muted)}
.say .lab{font:500 11px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:10px}
.say .yes .lab{color:var(--accent)}
.say .no .lab{color:var(--muted)}
.tip{margin-top:28px;padding:18px;background:var(--accent-soft);border-radius:14px}
.tip .lab{font:500 11px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:8px}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font:500 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.p{font:500 15px/1.4 var(--font-mono);white-space:nowrap}
td small{display:block;color:var(--muted);font-size:13px}

.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.rules .card p{color:var(--muted);font-size:15px}
.pairs{border-top:1px solid var(--line)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;padding:16px 0;border-bottom:1px solid var(--line)}
.pair .lab{font:500 11px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:6px}
.pair .y .lab{color:var(--accent)}
.pair .n .lab{color:var(--muted)}
.pair .n p{color:var(--muted)}
@media (max-width:620px){
  .pair{grid-template-columns:1fr;gap:12px}
  .ideas li{grid-template-columns:1fr}
  .view{padding-top:28px}
  .section{margin-top:48px}
}
.foot-note{margin-top:72px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:grid;gap:8px}
.foot-note a{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){
  a.card{transition:border-color .15s}
}
</style>
</head>

  var LOWREACH=["cleansing-melts", "retinol24-max", "super-eyes", "super-serum-mini"];

  var RULES=[
    ["Describe, don’t diagnose","Talk about how skin looks and feels to you. Never say a product treats, fixes, cures or prevents a condition."],
    ["No guarantees","Say what you used and how often. Do not promise a result, a timeline or a transformation."],
    ["Honest before and after","Same light, same angle, no filters or retouching. Say it is your experience, and say how long you used it."],

    ["Sunscreen wording","Use the label’s own words: SPF 30, daily facial sunscreen. Do not talk about preventing skin cancer, sun damage or aging."],

    ["Other brands","Do not compare Olay with other brands or say another product is worse."]
  ];

  var PAIRS=[
    ["“My skin looks smoother to me after two weeks.”","“This erases wrinkles.”"],

    ["“I wear it every morning and reapply as the pack says.”","“This protects you from sun damage.”"],

    ["“I’m trying it for a week and I’ll report back.”","“Guaranteed results in 7 days.”"]
  ];

  function badge(s){return '<span class="badge '+s+'">'+ICON[s]+SLOT[s]+'</span>';}
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
  function byId(id){for(var i=0;i<P.length;i++){if(P[i].id===id)return P[i];}return null;}

  function overview(){
    var cards=P.map(function(p){
      return '<a class="card" href="#'+p.id+'">'+badge(p.slot)+'<div class="name">'+esc(p.name)+'</div><div class="hook">'+esc(p.hook)+'</div><div class="foot"><b>'+p.price+'</b><span>Open brief →</span></div></a>';
    }).join("");
    var fm=FORMATS.map(function(f){return '<div><h3>'+f[0]+'</h3><p>'+f[1]+'</p></div>';}).join("");
    return ''+
    '<p class="eyebrow">Creator brief</p>'+
    '<h1>Show the routine,<br><em>not the claim.</em></h1>'+
    '<p class="lede">Fifteen products, plus a set of bundles, from Olay’s TikTok Shop. Each page gives you the routine slot, the price, the hooks that work on camera, real example videos, and the wording that keeps your video on the label. Pick one, read its page, and film something honest.</p>'+

    '<section class="section"><div class="sechead"><h2>Build the routine</h2><p>A suggested filming order, from thin textures to thick and sunscreen last. Follow each pack’s directions for use.</p></div>'+
    '<div class="routine"><div class="toggle" role="group" aria-label="Routine time"><button type="button" id="b-am" aria-pressed="true">Morning</button><button type="button" id="b-pm" aria-pressed="false">Night</button></div><ol class="steps" id="steps"></ol><p class="note">Tap a product name to open its brief.</p></div></section>'+
    '<section class="section"><div class="sechead"><h2>Formats that work for any product</h2><p>Start with one of these, then add the product-specific hooks on its own page.</p></div><div class="formats">'+fm+'</div></section>'+
    footer();
  }

  function fmtPlays(n){if(n>=1000000)return (n/1000000).toFixed(1).replace(/\.0$/,"")+"M";if(n>=1000)return Math.round(n/1000)+"K";return String(n);}
  function fmtLen(s){if(s<60)return s+" sec";var m=Math.floor(s/60),r=s%60;return m+" min"+(r?" "+r+" sec":"");}
  function videosHtml(p){
    var list=VIDEOS[p.id]||[];
    if(!list.length){return '<section class="section"><div class="sechead"><h2>Example videos</h2></div><p class="vnote">Example videos for this product are not added yet. Use the formats on the Overview page, and check the product’s page on TikTok Shop for current clips.</p></section>';}
    var cards=list.map(function(v){
      return '<div class="vid"><div class="plays">'+fmtPlays(v.p)+'<small>plays</small></div><div class="who">@'+esc(v.h)+'</div><div class="meta"><span>'+fmtLen(v.s)+'</span><span>'+v.d+'</span><span class="'+(v.b?'tagb':'')+'">'+(v.b?'Ad-boosted':'Organic')+'</span></div><p>'+esc(v.n)+'</p><a class="watch" href="'+v.u+'" target="_blank" rel="noopener">Watch on TikTok →</a></div>';

  var app=document.getElementById("app"), nav=document.getElementById("nav");

  P.forEach(function(p){labels[p.id]=p.short;});
  nav.innerHTML=order.map(function(id){return '<a href="#'+id+'" data-v="'+id+'">'+labels[id]+'</a>';}).join("");

  var views={};
  order.forEach(function(id){
    var s=document.createElement("section");
    s.className="view"; s.dataset.v=id; s.hidden=true;
    s.innerHTML= id==="overview"?overview(): id==="pricing"?pricing(): id==="bundles"?bundles(): id==="claims"?claims(): product(byId(id));
    app.appendChild(s); views[id]=s;

  function renderSteps(which){
    var ol=document.getElementById("steps");
    ol.innerHTML=ROUTINE[which].map(function(s,i){
      return '<li><span class="n">'+String(i+1).padStart(2,"0")+'</span><div><a href="#'+s[0]+'">'+esc(s[1])+'</a><small>'+esc(s[2])+'</small></div></li>';
    }).join("");
    document.getElementById("b-am").setAttribute("aria-pressed",which==="am");
    document.getElementById("b-pm").setAttribute("aria-pressed",which==="pm");
  }
  document.getElementById("b-am").addEventListener("click",function(){renderSteps("am");});
  document.getElementById("b-pm").addEventListener("click",function(){renderSteps("pm");});
  renderSteps("am");

  function show(){
    var id=location.hash.replace("#","");
    if(order.indexOf(id)<0) id="overview";
    order.forEach(function(k){views[k].hidden=(k!==id);});
    var links=nav.querySelectorAll("a");
    for(var i=0;i<links.length;i++){
      var on=links[i].dataset.v===id;
      if(on){links[i].setAttribute("aria-current","page"); try{links[i].scrollIntoView({block:"nearest",inline:"center"});}catch(e){}}
      else links[i].removeAttribute("aria-current");
    }
    window.scrollTo(0,0);
  }
  window.addEventListener("hashchange",show);
  show();
})();
